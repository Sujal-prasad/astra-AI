
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra — Sign In</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-box">

            <div class="login-header">

                <div class="kicker mono">
                    Astra — Never Lose the Thread.
                </div>

                <h1>Welcome back.</h1>

                <p>
                    Sign in to continue to your meeting workspace.
                </p>

            </div>

            <form class="login-form" id="login-form">

                <div class="input-box">

                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="input-field"
                        placeholder="you@example.com"
                        required
                    >

                </div>

                <div class="input-box">

                    <div class="password-header">

                        <label for="password">Password</label>

                        <a href="#" class="forgot-password">
                            Forgot password?
                        </a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="input-field"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <div class="remember">

                    <label>
                        <input type="checkbox" id="check" name="remember">
                        <span>Remember me</span>
                    </label>

                </div>

                <button type="submit" class="input-submit">
                    Sign in
                </button>

            </form>

            <p class="auth-status" id="auth-status" role="status"></p>

            <div class="middle-text">
                <span></span>
                <p class="or-text mono">OR</p>
                <span></span>
            </div>

            <button class="input-google" id="google-sign-in" type="button">

                <img
                    src="../assets/google sign in.png"
                    alt=""
                >

                <span>Continue with Google</span>

            </button>

            <div class="sign-up">

                <p>
                    Don't have an account?
                    <a href="signup.html">Create one</a>
                </p>

            </div>

        </div>

    </main>

</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../auth-config.js"></script>
<script>
    const supabaseClient = window.supabase.createClient(
        window.ASTRA_SUPABASE_URL,
        window.ASTRA_SUPABASE_ANON_KEY
    );
    const appUrl = window.ASTRA_APP_URL;
    const authPageUrl = window.location.href.split("?")[0].split("#")[0];
    const statusMessage = document.getElementById("auth-status");
    const signedOut = new URLSearchParams(window.location.search).has("signedout");

    function setStatus(message) {
        statusMessage.textContent = message;
    }

    async function enterAstra(session) {
        const params = new URLSearchParams({
            access_token: session.access_token,
            refresh_token: session.refresh_token
        });
        window.location.href = `${appUrl}/?${params.toString()}`;
    }

    async function continueWithGoogle() {
        setStatus("Opening Google sign in...");
        const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: "google",
            options: { redirectTo: authPageUrl }
        });
        if (error) setStatus(error.message);
    }

    document.getElementById("google-sign-in").addEventListener("click", continueWithGoogle);

    document.getElementById("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        setStatus("Signing in...");
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        });
        if (error) return setStatus(error.message);
        await enterAstra(data.session);
    });

    if (signedOut) {
        setStatus("You have been signed out.");
        window.history.replaceState({}, "", authPageUrl);
    } else {
        supabaseClient.auth.getSession().then(({ data }) => {
            if (data.session) enterAstra(data.session);
        });
    }
</script>
</html>
