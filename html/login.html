
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra — Sign In</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-box">

            <div class="login-header">

                <div class="kicker mono">
                    Astra — Never Lose the Thread.
                </div>

                <h1>Welcome back.</h1>

                <p>
                    Sign in to continue to your meeting workspace.
                </p>

            </div>

            <form class="login-form">

                <div class="input-box">

                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="input-field"
                        placeholder="you@example.com"
                        required
                    >

                </div>

                <div class="input-box">

                    <div class="password-header">

                        <label for="password">Password</label>

                        <a href="#" class="forgot-password">
                            Forgot password?
                        </a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="input-field"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <div class="remember">

                    <label>
                        <input type="checkbox" id="check" name="remember">
                        <span>Remember me</span>
                    </label>

                </div>

                <button type="submit" class="input-submit">
                    Sign in
                </button>

            </form>

            <div class="middle-text">
                <span></span>
                <p class="or-text mono">OR</p>
                <span></span>
            </div>

            <button class="input-google" type="button">

                <img
                    src="../assets/google sign in.png"
                    alt=""
                >

                <span>Continue with Google</span>

            </button>

            <div class="sign-up">

                <p>
                    Don't have an account?
                    <a href="signup.html">Create one</a>
                </p>

            </div>

        </div>

    </main>

</body>
</html>
