
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra — Sign In</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <div class="transition-overlay" id="transition-overlay" aria-live="polite">
        <div class="transition-card">
            <div class="astra-loader-rule"></div>
            <div class="astra-loader-track">
                <div class="astra-loader-progress"></div>
            </div>
            <div class="astra-loader-meta">
                <span class="transition-label mono">Opening your workspace</span>
                <span class="astra-loader-dot"></span>
            </div>
        </div>
    </div>

    <main class="login-page">

        <div class="login-box">

            <div class="login-header">

                <div class="kicker mono">
                    Astra — Never Lose the Thread.
                </div>

                <h1>Welcome back.</h1>

                <p>
                    Sign in to continue to your meeting workspace.
                </p>

            </div>

            <form class="login-form" id="login-form">

                <div class="input-box">

                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="input-field"
                        placeholder="you@example.com"
                        required
                    >

                </div>

                <div class="input-box">

                    <div class="password-header">

                        <label for="password">Password</label>

                        <a href="#" class="forgot-password">
                            Forgot password?
                        </a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="input-field"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <div class="remember">

                    <label>
                        <input type="checkbox" id="check" name="remember">
                        <span>Remember me</span>
                    </label>

                </div>

                <button type="submit" class="input-submit">
                    Sign in
                </button>

            </form>

            <p class="auth-status" id="auth-status" role="status"></p>

            <div class="middle-text">
                <span></span>
                <p class="or-text mono">OR</p>
                <span></span>
            </div>

            <button class="input-google" id="google-sign-in" type="button">

                <img
                    src="../assets/google sign in.png"
                    alt=""
                >

                <span>Continue with Google</span>

            </button>

            <div class="sign-up">

                <p>
                    Don't have an account?
                    <a href="signup.html">Create one</a>
                </p>

                <p class="demo-link">
                    Just looking?
                    <a href="#" id="view-demo">View a sample meeting</a>
                </p>

            </div>

        </div>

    </main>

</body>
<script src="../auth-config.js"></script>
<script>
    const astraSignedOut = new URLSearchParams(window.location.search).has("signedout");

    if (astraSignedOut) {
        let token = null;
        for (const store of [window.localStorage, window.sessionStorage]) {
            for (const key of Object.keys(store)) {
                if (!key.startsWith("sb-") && !key.startsWith("supabase.")) continue;
                const raw = store.getItem(key);
                if (raw && raw.includes("access_token")) {
                    try {
                        const parsed = JSON.parse(raw);
                        if (parsed && parsed.access_token) token = parsed.access_token;
                    } catch (error) {
                        token = token || null;
                    }
                }
                store.removeItem(key);
            }
        }

        if (token && window.ASTRA_SUPABASE_URL) {
            try {
                fetch(window.ASTRA_SUPABASE_URL + "/auth/v1/logout?scope=global", {
                    method: "POST",
                    keepalive: true,
                    headers: {
                        apikey: window.ASTRA_SUPABASE_ANON_KEY,
                        Authorization: "Bearer " + token
                    }
                });
            } catch (error) {
                token = null;
            }
        }

        const early = document.getElementById("auth-status");
        early.textContent = "You have been signed out.";
        early.className = "auth-status is-success";
        sessionStorage.removeItem("astra-auto-entry");
        window.history.replaceState({}, "", window.location.pathname);
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseClient = window.supabase.createClient(
        window.ASTRA_SUPABASE_URL,
        window.ASTRA_SUPABASE_ANON_KEY
    );
    const appUrl = window.ASTRA_APP_URL;
    const authPageUrl = window.location.href.split("?")[0].split("#")[0];
    const statusMessage = document.getElementById("auth-status");
    const signedOut = astraSignedOut;

    function setStatus(message, kind = "info") {
        statusMessage.textContent = message;
        statusMessage.className = "auth-status" + (kind === "info" ? "" : ` is-${kind}`);
    }

    function showTransition() {
        document.getElementById("transition-overlay").classList.add("active");
    }

    function enterAstra(session) {
        showTransition();
        const params = new URLSearchParams({
            access_token: session.access_token,
            refresh_token: session.refresh_token
        });
        window.location.href = `${appUrl}/?${params.toString()}`;
    }

    function enterAstraAutomatically(session) {
        const previous = Number(sessionStorage.getItem("astra-auto-entry") || 0);
        sessionStorage.setItem("astra-auto-entry", String(Date.now()));
        if (previous && Date.now() - previous < 8000) {
            sessionStorage.removeItem("astra-auto-entry");
            setStatus(
                "Sign-in kept returning here, so your stored session is probably stale. " +
                "Sign in again to refresh it.",
                "error"
            );
            return;
        }
        enterAstra(session);
    }

    async function continueWithGoogle() {
        setStatus("Opening Google sign in...");
        const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: "google",
            options: { redirectTo: authPageUrl }
        });
        if (error) setStatus(error.message, "error");
    }

    document.getElementById("google-sign-in").addEventListener("click", continueWithGoogle);

    document.getElementById("view-demo").addEventListener("click", (event) => {
        event.preventDefault();
        showTransition();
        window.location.href = `${appUrl}/?demo=1`;
    });

    document.getElementById("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        setStatus("Signing in...");
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        });
        if (error) return setStatus(error.message, "error");
        sessionStorage.removeItem("astra-auto-entry");
        enterAstra(data.session);
    });

    if (!signedOut) {
        supabaseClient.auth.getSession().then(({ data }) => {
            if (data.session) enterAstraAutomatically(data.session);
        });
    }
</script>
</html>
