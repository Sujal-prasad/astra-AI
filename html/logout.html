<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astra - Signing out</title>
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="transition-overlay active" aria-live="polite">
      <div class="transition-card">
        <div class="astra-loader-rule"></div>
        <div class="astra-loader-track">
          <div class="astra-loader-progress"></div>
        </div>
        <div class="astra-loader-meta">
          <span class="transition-label mono" id="logout-status">Signing you out</span>
          <span class="astra-loader-dot"></span>
        </div>
      </div>
    </div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../auth-config.js"></script>
  <script>
    (async () => {
      try {
        const supabaseClient = window.supabase.createClient(
          window.ASTRA_SUPABASE_URL,
          window.ASTRA_SUPABASE_ANON_KEY
        );
        await supabaseClient.auth.signOut();
      } catch (error) {
        document.getElementById("logout-status").textContent = error.message;
      } finally {
        window.location.replace("login.html?signedout=1");
      }
    })();
  </script>
</html>
